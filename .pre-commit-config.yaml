repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Recorded HTTP fixtures must stay byte-identical to what the server returned.
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/http/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/http/
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5000"]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict src
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
