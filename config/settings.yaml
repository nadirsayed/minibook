# Runtime settings for minibook. Every tunable number lives here (no magic numbers in code).

data:
  raw_dir: data/raw
  # Immutable EURIBOR proxy fixings (derived from ECB data; committed, ADR-016).
  fixings_dir: data/fixings
  # 501 aligned dates before 2026-12-31 + 60d realized-vol warm-up, with margin.
  history_start: 2023-06-01

http:
  timeout_s: 60
  max_retries: 4
  backoff_initial_s: 2.0
  backoff_factor: 2.0
  user_agent: "minibook/0.1 (+https://github.com/nadirsayed/minibook)"

ecb:
  # Source: ECB Data Portal SDMX REST API, https://data.ecb.europa.eu/help/api/data
  # Reuse: ESCB statistics reuse policy (free reuse, source must be quoted).
  base_url: https://data-api.ecb.europa.eu/service/data
  yield_curve:
    flow: YC
    # Svensson parameters, AAA euro area central government bonds, continuous compounding.
    key_prefix: B.U2.EUR.4F.G_N_A.SV_C_YM
    params: [BETA0, BETA1, BETA2, BETA3, TAU1, TAU2]
    # Published spot rates used only to validate the Svensson rebuild.
    validation: [SR_1Y, SR_5Y, SR_10Y]
  fx:
    flow: EXR
    # ECB reference rates: units of currency per 1 EUR.
    keys: {USD: D.USD.EUR.SP00.A, JPY: D.JPY.EUR.SP00.A}
  rating_curves:
    # Published spot rates of the AAA and all-ratings euro area curves, used only by the
    # scenario artefact detector (owner decision after M8, ADR-028).
    flow: YC
    prefixes: {AAA: B.U2.EUR.4F.G_N_A.SV_C_YM, ALL: B.U2.EUR.4F.G_N_C.SV_C_YM}
    tenors: [SR_2Y, SR_5Y, SR_10Y]
  estr:
    flow: EST
    key: B.EU000A2X2A25.WT

treasury:
  # Primary USD source (ADR-012): U.S. Treasury Daily Par Yield Curve Rates (public domain).
  url_template: https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all
  params: {type: daily_treasury_yield_curve, page: "", _format: csv}
  # Tenor label -> CSV column. Only tenors present in every year since 2023 (the 1.5M
  # column started in 2025), so the USD pillars, and the VaR risk factors, never change.
  columns: {1M: "1 Mo", 2M: "2 Mo", 3M: "3 Mo", 4M: "4 Mo", 6M: "6 Mo", 1Y: "1 Yr",
            2Y: "2 Yr", 3Y: "3 Yr", 5Y: "5 Yr", 7Y: "7 Yr", 10Y: "10 Yr"}
  # FRED cross-check (ADR-012): flag |Treasury - FRED| above this, in bp.
  fred_crosscheck_bp: 1.0

fred:
  # Cross-check only since ADR-012. Source: FRED, Federal Reserve Bank of St. Louis; series are H.15 Treasury constant
  # maturity par yields (Public Domain: citation requested), https://fred.stlouisfed.org/legal/
  url: https://fred.stlouisfed.org/graph/fredgraph.csv
  series: {1M: DGS1MO, 3M: DGS3MO, 6M: DGS6MO, 1Y: DGS1, 2Y: DGS2, 3Y: DGS3,
           5Y: DGS5, 7Y: DGS7, 10Y: DGS10}

mof:
  # Source: Japan Ministry of Finance, JGB interest rates (constant maturity, semi-annual
  # compounding). Licence: Public Data License 1.0 (https://www.mof.go.jp/about_mof/notice/).
  latest_url: https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/jgbcme.csv
  history_url: https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/historical/jgbcme_all.csv
  encoding: latin-1
  missing_marker: "-"

equities:
  tickers: {SX5E: ^STOXX50E, DAX: ^GDAXI, CAC40: ^FCHI, FTSEMIB: FTSEMIB.MI}
  # Exchange calendar of each index (minibook.dates.calendars.CALENDARS), used for
  # forward-fill reasons and the market-closure exemption (ADR-011, ADR-013).
  calendars: {SX5E: EUREX, DAX: XETRA, CAC40: EURONEXT_PARIS, FTSEMIB: BORSA_ITALIANA}
  # ADR-003: a bar dated on the fetch day is accepted only after this local time.
  # The latest end of index calculation among the four indices is 18:00 CET (EURO STOXX 50
  # calculation hours 09:00-18:00 CET); 18:30 leaves a 30-minute margin for vendor delay.
  close_cutoff_local: "18:30"
  timezone: Europe/Berlin

market:
  # Brief: forward-fill at most 3 calendar days, then fail explicitly.
  max_ffill_days: 3
  # If true, a longer gap is allowed when every weekday in it is a holiday of the source's
  # own market calendar (e.g. Japanese Golden Week). Approved by owner 2026-11-12 (ADR-011).
  market_closure_exempt: true
  # Brief: Svensson rebuild must match ECB published spot rates to <= 0.1 bp.
  svensson_tolerance_bp: 0.1
  # Key-rate DV01 pillars (brief). Added to every curve as pillars (ADR-009).
  key_pillars: [3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y]
  # EUR Svensson sampling grid: monthly to 1Y, quarterly to 3Y, semi-annual to 10Y.
  # Max |linear interpolation - Svensson| over 2023-06-01..2026-11-11, t in [1M, 10.5Y]:
  # 0.54 bp (measured 2026-11-12, ADR-009).
  eur_pillars: [1M, 2M, 3M, 4M, 5M, 6M, 7M, 8M, 9M, 10M, 11M, 1Y, 15M, 18M, 21M, 2Y, 27M,
                30M, 33M, 3Y, 42M, 4Y, 54M, 5Y, 66M, 6Y, 78M, 7Y, 90M, 8Y, 102M, 9Y, 114M,
                10Y, 12Y, 15Y, 20Y, 30Y]
  usd:
    # Treasury bills: bond-equivalent simple yields (ADR-010).
    money_market: [1M, 2M, 3M, 4M, 6M]
    coupon_frequency: 2
  jpy:
    # MoF constant-maturity yields used for the curve (book needs <= 10Y).
    tenors: [1Y, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10Y]
    coupon_frequency: 2
  vol:
    # EWMA realized-vol proxy (ADR-002): RiskMetrics lambda for daily data.
    ewma_lambda: 0.94
    warmup_days: 60
    annualization_days: 252

# FX spot conventions (ADR-015). Spot lag counted on the non-USD calendar(s); the spot and
# delivery dates must be business days in every settlement calendar.
fx_conventions:
  EURUSD: {spot_lag: 2, lag_calendars: [TARGET], settlement_calendars: [TARGET, US-FED]}
  USDJPY: {spot_lag: 2, lag_calendars: [JP], settlement_calendars: [US-FED, JP]}

risk:
  # Brief units: DV01 = PV(curve + 1bp) - PV(base); key-rate DV01 with the same bump.
  rate_bump: 1.0e-4
  # Theta: EUR per calendar day, market held constant (ADR-020).
  theta_days: 1
  # Analytic BSM theta is per year (ACT/365F); converted per calendar day.
  days_per_year: 365.0
  # Dividend-yield sensitivity reported per +10 bp of q (owner request, ADR-019).
  div_yield_bump: 1.0e-3

pnl:
  # Brief: flag a day when |unexplained| > max(5% of |actual|, EUR 1,000).
  unexplained_rel_threshold: 0.05
  unexplained_abs_threshold_eur: 1000.0

var:
  # Brief: historical simulation, full revaluation, 1-day horizon, 500 joint scenarios.
  n_scenarios: 500
  var_confidence: 0.99      # VaR99 = -(ceil(0.01 N)-th worst P&L)
  es_confidence: 0.975      # ES97.5 = -mean(worst ceil(0.025 N) P&Ls)
  n_worst: 5                # worst scenarios shown in the report
  # Sampling uncertainty (owner, after M6): nonparametric bootstrap of the 500 scenario
  # P&Ls, seeded for deterministic outputs; two-sided interval.
  bootstrap_resamples: 2000
  bootstrap_seed: 20261102
  bootstrap_ci: 0.90
  # Scenario artefact detector (owner, ADR-028): flag a scenario day when the AAA minus
  # all-ratings spot-rate gap moves by more than sigma_threshold standard deviations at a
  # pillar and at least reversal_fraction of that move reverses within reversal_days
  # business days. Flags are reported; scenarios are never removed.
  artefact_sigma_threshold: 5.0
  artefact_reversal_days: 2
  artefact_reversal_fraction: 0.5
backtest:
  # Basel Committee (1996), "Supervisory framework for the use of backtesting in conjunction
  # with the internal models approach to market risk capital requirements": 99% VaR over
  # 250 observations; green 0-4 exceptions, yellow 5-9, red 10 or more.
  min_observations: 250
  yellow_from: 5
  red_from: 10
  kupiec_significance: 0.05

pipeline:
  output_dir: output        # output/YYYY-MM-DD/: CSV, JSON, PDF (committed: no index levels)
  reports_dir: reports      # reports/YYYY-MM-DD.pdf (committed)
  # Incremental fetch: re-read this many calendar days before the last stored observation
  # (catches late revisions; the store logs any revision).
  fetch_lookback_days: 14
  # Daily schedule (ADR-001): Mon-Fri, ~13:00-18:00 Europe/Berlin; cron is UTC, so the job
  # is triggered hourly and checks the local window itself.
  timezone: Europe/Berlin
  window_start_local: "13:00"
  window_end_local: "19:00" # admits the last trigger, 18:47 local, in CET and CEST
  # Exit code when today's report cannot be produced yet (ECB curve not published).
  not_ready_exit_code: 75
